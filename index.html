<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scholarton Admin</title>
    <meta name="description" content="Admin console for Scholarton — manage students, mentors and projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so a dark-mode reload does
      // not flash a white page. Mirrors the main app's FOUC guard.
      (function () {
        try {
          var stored = localStorage.getItem("scholarton-admin-theme");
          var theme = stored ? JSON.parse(stored)?.state?.theme : null;
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (!theme && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* ignore — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
